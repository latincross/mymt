name: build-dm-worker

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'tracker.go.patch'
      - '.github/workflows/build-dm-worker.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false

      - name: Show Go version
        run: go version

      - name: Clone tiflow v8.5.7
        run: |
          git clone --depth 1 --branch v8.5.7 https://github.com/pingcap/tiflow.git tiflow-src

      - name: Apply schema-tracker patch
        working-directory: tiflow-src
        run: |
          git apply --check ../tracker.go.patch
          git apply ../tracker.go.patch
          echo "--- patched hunk ---"
          grep -n "fixedSQLMode\|setSQLMode :=" dm/pkg/schema/tracker.go

      - name: Build dm-worker
        working-directory: tiflow-src
        env:
          CGO_ENABLED: '0'
          GOFLAGS: '-mod=mod'
        run: |
          go build -trimpath -ldflags="-s -w" -o bin/dm-worker ./cmd/dm-worker
          file bin/dm-worker

      - name: Package tarball
        run: |
          mkdir -p tidb-dm-worker-v8.5.7-linux-amd64/bin
          cp tiflow-src/bin/dm-worker tidb-dm-worker-v8.5.7-linux-amd64/bin/dm-worker
          cat > tidb-dm-worker-v8.5.7-linux-amd64/README.md <<'EOF'
          # tidb-dm-worker v8.5.7 (schema-tracker patched)

          解决 DM 增量阶段 schema-tracker 初始化报错：
            Error 1231 (42000): Variable 'sql_mode' can't be set to 'NO_AUTO_CREATE_USER'

          部署 (tiup):
            tiup dm patch <dm-cluster-name> ./tidb-dm-worker-v8.5.7-linux-amd64/bin/dm-worker --role dm-worker

          注意: 自行编译的 DM 不在 PingCAP 官方支持范围内。
          EOF
          tar -czf tidb-dm-worker-v8.5.7-linux-amd64.tar.gz tidb-dm-worker-v8.5.7-linux-amd64
          ls -la tidb-dm-worker-v8.5.7-linux-amd64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tidb-dm-worker-v8.5.7-linux-amd64
          path: tidb-dm-worker-v8.5.7-linux-amd64.tar.gz
          if-no-files-found: error
